<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Районы Пхукета — BOOMERANG Real Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #134074; --navy-dark: #0d2d52; --gold: #c9a84c;
  --cream: #faf8f4; --white: #fff;
  --text-main: #1a1a1a; --text-muted: #6b7280; --text-light: #9ca3af;
  --border: #e5e7eb;
  --plus-bg: #edf7f0; --plus-text: #1a6b3c;
  --minus-bg: #fef2f2; --minus-text: #991b1b;
  --info-bg: #eff6ff; --info-text: #1d4ed8;
}
body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--text-main); min-height: 100vh; }

.hero { background: var(--navy); padding: 44px 40px 36px; position: relative; overflow: hidden; }
.hero::before { content:''; position:absolute; top:-60px; right:-60px; width:300px; height:300px; border-radius:50%; background:rgba(201,168,76,.12); }
.hero::after  { content:''; position:absolute; bottom:-80px; left:30%; width:200px; height:200px; border-radius:50%; background:rgba(201,168,76,.07); }
.hero-inner { max-width:1000px; margin:0 auto; position:relative; z-index:1; display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; }
.hero-text { flex:1; min-width:280px; }
.brand-logo { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.brand-logo img { height:32px; width:auto; flex-shrink:0; }
.brand-logo-text { display:flex; flex-direction:column; line-height:1.05; }
.brand-logo-name { font-family:'Inter',sans-serif; font-size:18px; font-weight:600; color:#fff; letter-spacing:-0.01em; }
.brand-logo-sub { font-family:'Inter',sans-serif; font-size:10px; font-weight:500; color:rgba(255,255,255,.55); letter-spacing:.04em; text-transform:lowercase; }
.hero-eyebrow { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.4); font-weight:500; margin-bottom:18px; }
.hero h1 { font-family:'Playfair Display',serif; font-size:clamp(26px,3.8vw,44px); font-weight:600; color:#fff; line-height:1.2; margin-bottom:14px; }
.hero-sub { font-size:14px; color:rgba(255,255,255,.62); max-width:500px; line-height:1.75; margin-bottom:16px; }
.hero-stats { display:flex; gap:36px; flex-wrap:wrap; }
.stat-num { font-family:'Playfair Display',serif; font-size:26px; font-weight:600; color:var(--gold); line-height:1; }
.stat-label { font-size:11px; color:rgba(255,255,255,.45); margin-top:3px; }

.lang-toggle { display:flex; gap:6px; align-self:flex-start; }
.lang-btn { font-family:'Inter',sans-serif; font-size:12px; font-weight:600; padding:6px 14px; border-radius:20px; border:1.5px solid rgba(255,255,255,.3); background:transparent; color:rgba(255,255,255,.6); cursor:pointer; transition:all .18s; letter-spacing:.04em; }
.lang-btn.active { background:var(--gold); border-color:var(--gold); color:#fff; }
.lang-btn:hover:not(.active) { border-color:var(--gold); color:var(--gold); }

.map-section { max-width:1000px; margin:36px auto 0; padding:0 20px; }
.section-eyebrow { font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-light); font-weight:600; margin-bottom:12px; }
.map-wrap { border-radius:16px; overflow:hidden; border:1px solid var(--border); box-shadow:0 4px 20px rgba(19,64,116,.08); position:relative; }
#map { height:500px; width:100%; }
.map-reset-btn {
  position:absolute; top:12px; right:12px; z-index:401;
  background:#fff; border:1px solid var(--border); border-radius:8px;
  font-family:'Inter',sans-serif; font-size:12px; font-weight:500; color:var(--navy);
  padding:7px 13px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.12);
  display:flex; align-items:center; gap:5px; transition:all .15s;
}
.map-reset-btn:hover { background:var(--cream); }

.leaflet-popup-content-wrapper { border-radius:12px!important; box-shadow:0 8px 32px rgba(19,64,116,.2)!important; padding:0!important; overflow:hidden; border:none!important; min-width:280px; }
.leaflet-popup-content { margin:0!important; width:auto!important; }
.leaflet-popup-tip { background:#fff!important; }
.leaflet-popup-close-button { color:rgba(255,255,255,.7)!important; font-size:18px!important; top:8px!important; right:10px!important; z-index:10; }
.popup-inner { font-family:'Inter',sans-serif; }
.popup-head { background:var(--navy); padding:14px 40px 12px 16px; }
.popup-coast { font-size:9px; text-transform:uppercase; letter-spacing:.1em; color:var(--gold); font-weight:600; margin-bottom:4px; }
.popup-name { font-size:15px; font-weight:600; color:#fff; margin-bottom:2px; }
.popup-sub { font-size:11px; color:rgba(255,255,255,.55); }
.popup-roi { display:inline-block; margin-top:8px; font-size:11px; font-weight:600; padding:3px 10px; border-radius:6px; }
.p-roi-high { background:var(--gold); color:#fff; }
.p-roi-mid  { background:rgba(201,168,76,.35); color:#fff; }
.p-roi-low  { background:rgba(255,255,255,.2); color:rgba(255,255,255,.85); }
.popup-body { padding:12px 16px 14px; background:#fff; }
.popup-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; margin-bottom:10px; }
.popup-meta-label { font-size:9px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-light); font-weight:600; }
.popup-meta-value { font-size:12px; font-weight:500; color:var(--text-main); margin-top:1px; }
.popup-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
.ptag { font-size:10px; padding:2px 8px; border-radius:5px; line-height:1.5; }
.ptag-plus  { background:var(--plus-bg); color:var(--plus-text); }
.ptag-minus { background:var(--minus-bg); color:var(--minus-text); }
.popup-note { margin-top:8px; font-size:11px; color:var(--text-muted); line-height:1.5; font-style:italic; }

.main { max-width:1000px; margin:0 auto; padding:36px 20px 60px; }
.filter-bar { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
.filter-group-label { font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-light); font-weight:600; margin-right:4px; white-space:nowrap; }
.filter-btn { font-family:'Inter',sans-serif; font-size:12px; padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--white); color:var(--text-muted); cursor:pointer; transition:all .18s; }
.filter-btn:hover { border-color:var(--navy); color:var(--navy); }
.filter-btn.active { background:var(--navy); border-color:var(--navy); color:#fff; }
.filter-btn.coast-w.active { background:#0e6ba8; border-color:#0e6ba8; }
.filter-btn.coast-e.active { background:#5c7a6b; border-color:#5c7a6b; }

.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px; }
.card { background:var(--white); border:1px solid var(--border); border-radius:14px; padding:18px 20px; display:flex; flex-direction:column; transition:transform .18s, box-shadow .18s, border-color .18s; cursor:pointer; }
.card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(19,64,116,.1); }
.card.hidden { display:none; }
.card.highlighted { border-color:var(--navy); box-shadow:0 0 0 2px var(--navy); }
.card-coast-badge { font-size:9px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:2px 8px; border-radius:4px; display:inline-block; margin-bottom:8px; }
.badge-west { background:#e0f0fb; color:#0e6ba8; }
.badge-east { background:#e5f2ec; color:#3a7a5a; }
.card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:12px; }
.card-name { font-size:15px; font-weight:600; color:var(--text-main); line-height:1.3; }
.card-sub  { font-size:11px; color:var(--text-light); margin-top:2px; }
.roi-badge { font-size:11px; font-weight:600; padding:4px 10px; border-radius:8px; white-space:nowrap; flex-shrink:0; }
.roi-high { background:var(--navy); color:#fff; }
.roi-mid  { background:var(--gold); color:#fff; }
.roi-low  { background:#e5e7eb; color:#6b7280; }
.tags-label { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-light); font-weight:600; margin-bottom:5px; margin-top:10px; }
.tag-row { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:4px; }
.tag { font-size:11px; padding:3px 9px; border-radius:6px; line-height:1.4; }
.tag-plus  { background:var(--plus-bg);  color:var(--plus-text); }
.tag-minus { background:var(--minus-bg); color:var(--minus-text); }
.card-note { margin-top:10px; font-size:11px; color:var(--text-muted); font-style:italic; line-height:1.5; }
.card-meta { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; padding-top:12px; border-top:1px solid var(--border); margin-top:14px; }
.meta-label { font-size:9px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-light); font-weight:600; }
.meta-value { font-size:12px; font-weight:500; color:var(--text-main); margin-top:1px; }

.disclaimer { margin-top:36px; padding:14px 18px; background:var(--white); border:1px solid var(--border); border-left:3px solid var(--gold); border-radius:8px; font-size:12px; color:var(--text-muted); line-height:1.65; }
footer { background:var(--navy-dark,#0d2d52); text-align:center; padding:22px 20px; font-size:12px; color:rgba(255,255,255,.38); }
footer span { color:var(--gold); }

/* TABS NAV */
.tabs-nav { position:sticky; top:0; z-index:50; background:rgba(250,248,244,.95); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); }
.tabs-nav-inner { max-width:1000px; margin:0 auto; display:flex; gap:4px; padding:0 20px; overflow-x:auto; }
.tab-btn { font-family:'Inter',sans-serif; font-size:13px; font-weight:500; padding:14px 18px; border:none; background:none; color:var(--text-muted); cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; transition:all .15s; }
.tab-btn:hover { color:var(--navy); }
.tab-btn.active { color:var(--navy); border-bottom-color:var(--navy); font-weight:600; }
.tab-page { display:none; }
.tab-page.active { display:block; animation:fadein .3s ease; }
@keyframes fadein { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

/* INFRA TAB */
.infra-section { max-width:1000px; margin:0 auto; padding:32px 20px 0; }
.infra-h2 { font-family:'Playfair Display',serif; font-size:24px; font-weight:600; color:var(--navy); margin-bottom:8px; }
.infra-lead { font-size:13.5px; color:var(--text-muted); line-height:1.7; max-width:760px; margin-bottom:24px; }
.infra-h3 { font-size:15px; font-weight:600; color:var(--navy); margin:32px 0 14px; display:flex; align-items:center; gap:8px; }
.infra-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
.infra-card { background:var(--white); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
.infra-tag { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); margin-bottom:6px; display:block; }
.infra-card h4 { font-size:14px; font-weight:600; color:var(--text-main); margin-bottom:4px; }
.infra-card .addr { font-size:11px; color:var(--text-light); margin-bottom:8px; }
.infra-card p { font-size:12.5px; color:var(--text-muted); line-height:1.6; }
.infra-note { background:#fdf6e9; border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:13px 16px; margin:18px 0; font-size:12.5px; color:#6b5524; line-height:1.65; }
.infra-table-wrap { overflow-x:auto; border-radius:12px; border:1px solid var(--border); }
.infra-table { width:100%; border-collapse:collapse; font-size:12.5px; background:var(--white); }
.infra-table th { background:var(--navy); color:#fff; text-align:left; padding:10px 14px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:500; }
.infra-table td { padding:10px 14px; border-bottom:1px solid var(--border); color:var(--text-main); vertical-align:top; }
.infra-table tr:last-child td { border-bottom:none; }
.infra-table tr:hover td { background:var(--cream); }

/* CLIMATE TAB */
.clim-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px; }
.clim-stat { background:var(--white); border:1px solid var(--border); border-radius:12px; padding:16px; text-align:left; }
.clim-stat .big { font-family:'Playfair Display',serif; font-size:22px; font-weight:600; color:var(--navy); }
.clim-stat .lbl { font-size:11.5px; color:var(--text-muted); margin-top:4px; line-height:1.4; }
.clim-chart-wrap { background:var(--white); border:1px solid var(--border); border-radius:14px; padding:20px 16px 10px; margin-bottom:20px; }
.clim-legend { display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:var(--text-muted); margin-bottom:12px; }
.clim-legend b { display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:5px; }

@media(max-width:640px){
  .hero { padding:36px 20px 32px; }
  .hero-stats { gap:20px; }
  .grid { grid-template-columns:1fr; }
  #map { height:360px; }
  .lang-toggle { order:-1; }
}
</style>
</head>

let currentLang = 'ru';
let currentFilter = 'all';
const markersMap = {};

const map = L.map('map', {
  zoomControl:true,
  scrollWheelZoom:false,
  minZoom:10,
  maxZoom:16
}).setView([7.930, 98.340], 11.4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap contributors', maxZoom:18 }).addTo(map);
map.setMaxBounds([[7.55, 97.95], [8.35, 98.75]]);

function pinColor(d) {
  const rc = d[currentLang].roiClass;
  if (rc === 'p-roi-high') return '#134074';
  if (rc === 'p-roi-mid')  return '#c9a84c';
  return '#8b95a1';
}
function makeIcon(d) {
  const c = pinColor(d);
  return L.divIcon({ className:'', html:`<div style="width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${c};border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(45deg);font-size:8px;font-weight:700;font-family:Inter,sans-serif;color:#fff;display:block;text-align:center;line-height:1.1;">ROI</span></div>`, iconSize:[38,38], iconAnchor:[19,38], popupAnchor:[0,-40] });
}
function popupHTML(d) {
  const L2 = d[currentLang], t = D[currentLang];
  const coastLabel = d.coast === 'west' ? t.west : t.east;
  const plus = L2.plus.map(p=>`<span class="ptag ptag-plus">${p}</span>`).join('');
  const minus = L2.minus.map(m=>`<span class="ptag ptag-minus">${m}</span>`).join('');
  const note = L2.note ? `<div class="popup-note">${L2.note}</div>` : '';
  return `<div class="popup-inner"><div class="popup-head"><div class="popup-coast">${coastLabel}</div><div class="popup-name">${L2.name}</div><div class="popup-sub">${L2.sub}</div><span class="popup-roi ${L2.roiClass}">${L2.roi}</span></div><div class="popup-body"><div class="popup-grid"><div><div class="popup-meta-label">${t.price}</div><div class="popup-meta-value">${L2.price}</div></div><div><div class="popup-meta-label">${t.audience}</div><div class="popup-meta-value">${L2.audience}</div></div><div><div class="popup-meta-label">${t.type}</div><div class="popup-meta-value">${L2.type}</div></div><div><div class="popup-meta-label">${t.strategy}</div><div class="popup-meta-value">${L2.strategy}</div></div></div><div class="popup-tags">${plus}${minus}</div>${note}</div></div>`;
}
districts.forEach(d => {
  const marker = L.marker([d.lat, d.lng], { icon: makeIcon(d) }).addTo(map).bindPopup(popupHTML(d), { maxWidth:320, minWidth:280 });
  marker.on('click', () => {
    highlightCard(d.id);
    const currentZoom = map.getZoom();
    if (currentZoom < 12.5) {
      map.flyTo(marker.getLatLng(), 12.5, { animate:true, duration:0.7, easeLinearity:0.25 });
    }
  });
  markersMap[d.id] = { marker, district: d };
});
function refreshPopups() {
  districts.forEach(d => {
    const m = markersMap[d.id].marker;
    m.setIcon(makeIcon(d));
    if (m.isPopupOpen()) m.setPopupContent(popupHTML(d));
    else m.bindPopup(popupHTML(d), { maxWidth:320, minWidth:280 });
  });
}
function renderCards() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const t = D[currentLang];
  districts.forEach(d => {
    const L2 = d[currentLang];
    const isWest = d.coast === 'west';
    const badgeClass = isWest ? 'badge-west' : 'badge-east';
    const badgeText = isWest ? t.badge_w : t.badge_e;
    const plus = L2.plus.map(p=>`<span class="tag tag-plus">${p}</span>`).join('');
    const minus = L2.minus.map(m=>`<span class="tag tag-minus">${m}</span>`).join('');
    const note = L2.note ? `<div class="card-note">${L2.note}</div>` : '';
    const roiCardClass = L2.roiClass==='p-roi-high'?'roi-high': L2.roiClass==='p-roi-mid'?'roi-mid':'roi-low';
    const hidden = shouldHide(d) ? ' hidden' : '';
    const div = document.createElement('div');
    div.className = `card${hidden}`;
    div.setAttribute('data-id', d.id);
    div.setAttribute('data-tags', d.tags.join(' '));
    div.innerHTML = `<span class="card-coast-badge ${badgeClass}">${badgeText}</span><div class="card-top"><div><div class="card-name">${L2.name}</div><div class="card-sub">${L2.sub}</div></div><span class="roi-badge ${roiCardClass}">${L2.roi}</span></div><div class="tags-label">${t.plus}</div><div class="tag-row">${plus}</div><div class="tags-label">${t.minus}</div><div class="tag-row">${minus}</div>${note}<div class="card-meta"><div><div class="meta-label">${t.price}</div><div class="meta-value">${L2.price}</div></div><div><div class="meta-label">${t.audience}</div><div class="meta-value">${L2.audience}</div></div><div><div class="meta-label">${t.type}</div><div class="meta-value">${L2.type}</div></div><div><div class="meta-label">${t.strategy}</div><div class="meta-value">${L2.strategy}</div></div></div>`;
    div.addEventListener('click', () => {
      const m = markersMap[d.id].marker;
      map.closePopup();
      map.flyTo(m.getLatLng(), 12.5, { animate:true, duration:0.85, easeLinearity:0.25 });
      m.bindPopup(popupHTML(d), { maxWidth:320, minWidth:280 });
      setTimeout(() => m.openPopup(), 500);
      document.querySelectorAll('.card').forEach(c=>c.classList.remove('highlighted'));
      div.classList.add('highlighted');
    });
    grid.appendChild(div);
  });
}
function shouldHide(d) { return currentFilter !== 'all' && !d.tags.includes(currentFilter); }
function highlightCard(id) {
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('highlighted'));
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (card) { card.classList.add('highlighted'); card.scrollIntoView({ behavior:'smooth', block:'center' }); }
}
function resetMapView() {
  map.closePopup();
  map.flyTo([7.930, 98.340], 11.4, { animate:true, duration:0.8, easeLinearity:0.25 });
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('highlighted'));
}
function filterCards(tag, btn) {
  currentFilter = tag;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.card').forEach(card => {
    const tags = card.getAttribute('data-tags') || '';
    card.classList.toggle('hidden', tag !== 'all' && !tags.includes(tag));
  });
}
function setLang(lang, btn) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('[data-ru],[data-en]').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if (val !== null) {
      if (el.tagName === 'H1' || el.innerHTML.includes('<')) el.innerHTML = val;
      else el.textContent = val;
    }
  });
  renderCards();
  refreshPopups();
  renderInfra();
}
document.querySelectorAll('[data-ru]').forEach(el => {
  const val = el.getAttribute('data-ru');
  if (val !== null) {
    if (el.tagName === 'H1' || el.tagName === 'SPAN' || el.tagName === 'H2' || el.tagName === 'H4' || el.innerHTML.includes('<')) el.innerHTML = val;
    else el.textContent = val;
  }
});
renderCards();

function showTab(id, btn) {
  document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (id === 'map-tab') setTimeout(() => map.invalidateSize(), 50);
}

  ).join('');

  document.getElementById('schoolTable').innerHTML =
    `<thead><tr><th>${t.table_headers.school[0]}</th><th>${t.table_headers.school[1]}</th><th>${t.table_headers.school[2]}</th><th>${t.table_headers.school[3]}</th></tr></thead><tbody>` +
    t.schools.map(s => `<tr><td><b>${s[0]}</b></td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3]}</td></tr>`).join('') +
    '</tbody>';

  document.getElementById('shopCards').innerHTML = t.shops.map(s =>
    `<div class="infra-card"><h4>${s.n}</h4><div class="addr">📍 ${s.a}</div><p>${s.p}</p></div>`
  ).join('');

  document.getElementById('driveTable').innerHTML =
    `<thead><tr><th>${t.table_headers.drive[0]}</th><th>${t.table_headers.drive[1]}</th></tr></thead><tbody>` +
    t.drives.map(d => `<tr><td>${d[0]}</td><td>${d[1]}</td></tr>`).join('') + '</tbody>';

  document.getElementById('climTable').innerHTML =
    `<thead><tr><th>${t.table_headers.clim[0]}</th><th>${t.table_headers.clim[1]}</th><th>${t.table_headers.clim[2]}</th><th>${t.table_headers.clim[3]}</th><th>${t.table_headers.clim[4]}</th></tr></thead><tbody>` +
    t.months.map(m => `<tr><td><b>${m[0]}</b></td><td>${m[1]} / ${m[2]}°C</td><td>${m[3]}</td><td>${m[4]}</td><td>${m[5]}</td></tr>`).join('') +
    '</tbody>';

  drawClimChart(t.months);
}

function drawClimChart(months) {
  const W=760, H=300, padL=42, padR=42, padB=40, padT=14;
  const n = months.length, cw = (W-padL-padR)/n;
  const maxRain=340, maxTemp=36, minTemp=20;
  let svg = '';
  for (let r=0; r<=300; r+=100) {
    const y = padT + (H-padT-padB)*(1-r/maxRain);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/>`;
    svg += `<text x="${padL-6}" y="${y+4}" fill="#9ca3af" font-size="10" text-anchor="end">${r}</text>`;
  }
  months.forEach((m,i) => {
    const cx = padL + cw*i + cw/2;
    const bh = (H-padT-padB)*(m[3]/maxRain);
    const by = padT + (H-padT-padB) - bh;
    const bw = cw*0.42;
    svg += `<rect x="${cx-bw}" y="${by}" width="${bw}" height="${bh}" rx="2" fill="#1d4ed8" opacity="0.82"/>`;
    const dh = (H-padT-padB)*(m[6]/5)*0.5;
    const dy = padT + (H-padT-padB) - dh;
    svg += `<rect x="${cx+1}" y="${dy}" width="${bw*0.7}" height="${dh}" rx="2" fill="#991b1b" opacity="0.78"/>`;
    svg += `<text x="${cx}" y="${H-padB+16}" fill="#6b7280" font-size="11" text-anchor="middle">${m[0]}</text>`;
  });
  const pts = months.map((m,i) => {
    const cx = padL + cw*i + cw/2;
    const ty = padT + (H-padT-padB)*(1-(m[2]-minTemp)/(maxTemp-minTemp));
    return [cx, ty];
  });
  const path = 'M' + pts.map(p => p[0]+','+p[1]).join(' L');
  svg += `<path d="${path}" fill="none" stroke="#c9a84c" stroke-width="2.5"/>`;
  pts.forEach((p,i) => {
    svg += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#c9a84c"/>`;
    svg += `<text x="${p[0]}" y="${p[1]-8}" fill="#a3852f" font-size="9.5" text-anchor="middle">${months[i][2]}</text>`;
  });
  document.getElementById('climChart').innerHTML = svg;
}
